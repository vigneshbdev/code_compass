[project]
name = "codecompass"
version = "0.1.0"
description = "Code Documentation Assistant: cited Q&A over a codebase (RAG)"
requires-python = ">=3.12,<3.13"
# Every dependency is justified in specs/001-code-assistant/plan.md "Dependencies".
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3.2",
    "alembic",
    "pgvector",
    "langchain-core>=1.0",
    "langchain>=1.0",
    "langchain-litellm",
    "litellm",
    "nemoguardrails",
    "langfuse>=5",
    "ragas",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "detect-secrets",
    "pathspec",
    "httpx",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codecompass"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["codecompass", "tests"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/**" = ["E501"]  # generated DDL lines
"tests/**" = ["S105", "S106", "S108"]  # fake secrets and temp paths in fixtures

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "nemoguardrails.*", "ragas.*", "detect_secrets.*", "testcontainers.*", "pgvector.*", "langchain_litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs a real LLM key and a running Langfuse"]
