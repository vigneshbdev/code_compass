# CodeCompass: one app service plus platform services (plan.md "Architecture", research R1).
# Start: `make init-env`, set GEMINI_API_KEY in .env, then `docker compose up --build`.
# The Langfuse services follow Langfuse v4's reference compose file (v4.80.0), trimmed to what
# this app uses (the optional AI gateway is left out). All image tags are pinned.

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?run make init-env}@postgres:5432/langfuse
  SALT: ${SALT:?run make init-env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run make init-env}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run make init-env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run make init-env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?run make init-env}

x-langfuse-depends: &langfuse-depends
  postgres: { condition: service_healthy }
  minio: { condition: service_healthy }
  redis: { condition: service_healthy }
  clickhouse: { condition: service_healthy }

services:
  app:
    build: .
    image: codecompass-app:local
    pull_policy: build   # built from this repo, never pulled
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/codecompass
      DATA_DIR: /data/tmp
      LANGFUSE_HOST: http://langfuse-web:3000
      # Same keys Langfuse creates at headless init, so tracing works on first start.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    depends_on:
      # Langfuse is deliberately not a dependency: tracing fails open (research R10).
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init-env}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      # Local development only (make migrate, dev server). Non-default port avoids clashing with
      # a Postgres already running on the host.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codecompass"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.80.0
    depends_on: *langfuse-depends
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?run make init-env}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?run make init-env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?run make init-env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?run make init-env}
    healthcheck:
      # Langfuse binds to the container's network address, not loopback, so use the service name.
      test: ["CMD", "wget", "-q", "--spider", "http://langfuse-web:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.80.0
    depends_on: *langfuse-depends
    environment: *langfuse-env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://langfuse-worker:3030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run make init-env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 1s
    restart: unless-stopped

  minio:
    # Chainguard publishes only a rolling tag, so the image is pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:9158c67aa441627c366442e84656f689e16bec4809851ec64318561a365b69e4
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make init-env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 1s
    restart: unless-stopped

  redis:
    image: docker.io/redis:7.4.12-alpine
    command: --requirepass ${REDIS_AUTH:?run make init-env} --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
